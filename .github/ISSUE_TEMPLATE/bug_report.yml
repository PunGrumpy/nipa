name: Bug report
description: nipa does something wrong or unexpected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran and what it printed. Remove tokens, passwords and project IDs you don't want public.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: nipa version
      description: Output of `nipa --version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Linux, Windows]
    validations:
      required: true
  - type: input
    id: shell
    attributes:
      label: Shell
      placeholder: fish 4.0, zsh 5.9, bash 5.2, pwsh 7.5
