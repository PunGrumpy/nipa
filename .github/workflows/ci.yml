name: CI

on:
  push:
    branches: [main]
  pull_request:
    # labeled and unlabeled rerun the Changeset job when `semver: none` changes.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      - run: bun run --cwd packages/cli check:package

  test:
    name: Test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # The npm package supports Node.js 22.13 and later, so test the oldest.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      # bash, zsh and pwsh come with the runners; fish does not.
      - name: Install fish and zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fish zsh
      - name: Install fish
        if: runner.os == 'macOS'
        run: brew install fish
      - run: bun run test
      - name: Smoke-test the compiled binary
        run: |
          bun run build
          ./packages/cli/dist/nipa --version
          ./packages/cli/dist/nipa completion bash > /dev/null
      - name: Smoke-test the npm package
        run: |
          bun run build:npm
          node packages/cli/dist/nipa.js --version
          node packages/cli/dist/nipa.js completion bash > /dev/null

  changeset:
    name: Changeset
    # Skipped for the version pull request, and for pull requests labeled
    # `semver: none` because users don't see their changes.
    if: "github.event_name == 'pull_request' && github.event.pull_request.title != 'chore: version packages' && !contains(github.event.pull_request.labels.*.name, 'semver: none')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      # Fails when the pull request has no changeset. Add one with `bun changeset`.
      - run: bunx changeset status --since="origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
